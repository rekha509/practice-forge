[project]
name = "practice-forge"
version = "0.1.0"
description = "Generates original, execution-verified engineering practice problem sets from textbook PDFs."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "docker>=7.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
    "celery>=5.4",
    "redis>=5.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "pint>=0.24",
    "numpy>=1.26",
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11",  # required by sympy.parsing.latex.parse_latex
    "scipy>=1.13",
    "matplotlib>=3.9",
    "datasketch>=1.6",
    "httpx>=0.27",
    "pypdf>=4.2",
    "google-genai>=1.0",
]

[project.scripts]
pf = "practice_forge.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "fpdf2>=2.7",  # tests/fixtures generation only (scripts/make_fixtures.py)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice_forge"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/fixtures", "code/", "scripts/"]

# docker-py and datasketch ship no py.typed marker / stub package.
[[tool.mypy.overrides]]
module = ["docker", "docker.*", "datasketch", "datasketch.*", "sympy", "sympy.*"]
ignore_missing_imports = true
# No py.typed marker; mypy still walks docker's untyped source (rather than
# treating the import as opaque) and trips over its dynamic re-exports
# (docker/client.py's from_env). Treat both as opaque Any instead.
follow_imports = "skip"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures", "code/", "scripts/"]

[tool.pytest.ini_options]
markers = [
    "llm: marks tests that make real LLM API calls (deselect with -m 'not llm')",
]
testpaths = ["tests"]
