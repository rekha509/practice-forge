[project]
name = "practice-forge"
version = "0.1.0"
description = "Generates original, execution-verified engineering practice problem sets from textbook PDFs."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "docker>=7.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
    "celery>=5.4",
    "redis>=5.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",  # required by FastAPI for multipart/form-data request bodies
    "pint>=0.24",
    "numpy>=1.26",
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11",  # required by sympy.parsing.latex.parse_latex
    "scipy>=1.13",
    "matplotlib>=3.9",
    "datasketch>=1.6",
    "httpx>=0.27",
    "pypdf>=4.2",
    "google-genai>=1.0",
    "typst>=0.13",  # S10 rendering (render/render.py) - real gap: installed ad hoc in an
                     # earlier session, never declared here, so a fresh env (a Docker build,
                     # a new dev venv) never got it and crashed on import at container startup.
]

[project.scripts]
pf = "practice_forge.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "fpdf2>=2.7",  # tests/fixtures generation only (scripts/make_fixtures.py)
    "playwright>=1.62",  # tests/test_api_e2e.py's real-browser CORS/connectivity smoke test
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice_forge"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/fixtures", "code/", "scripts/"]

# docker-py, datasketch, and celery ship no py.typed marker / stub package.
[[tool.mypy.overrides]]
module = ["docker", "docker.*", "datasketch", "datasketch.*", "sympy", "sympy.*", "celery", "celery.*"]
ignore_missing_imports = true
# No py.typed marker; mypy still walks docker's untyped source (rather than
# treating the import as opaque) and trips over its dynamic re-exports
# (docker/client.py's from_env). Treat both as opaque Any instead. Same
# deal for celery: no stubs, and its untyped `@task` decorator would
# otherwise make every task function `Untyped decorator` under `strict`.
follow_imports = "skip"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures", "code/", "scripts/"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires `Depends(...)` as an
# argument default — B008 doesn't know about FastAPI's special-casing of
# this pattern (same rationale FastAPI's own docs give for disabling it).
"api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
markers = [
    "llm: marks tests that make real LLM API calls (deselect with -m 'not llm')",
    "e2e: marks tests needing a real subprocess Celery worker + Docker sandbox (deselect with -m 'not e2e')",
]
testpaths = ["tests"]
# Real, previously-undisclosed gap found while scoping test_api_e2e.py:
# nothing enforced the "deselect with -m 'not llm'" the marker's own
# description implied — every plain `pytest`/`pytest -q` run this whole
# session actually executed test_detection.py's real Gemini call too,
# silently. Fixed here: `llm` and `e2e` are excluded by default; run
# them explicitly with `-m llm` / `-m e2e`.
addopts = "-m 'not llm and not e2e'"
