# Render Blueprint (P13). Deploys web + api on Render, backed by Neon
# (Postgres + pgvector, real free tier) and Render's own Key Value
# (Redis). worker + sandbox-runner deliberately are NOT here -- Render
# doesn't support Docker-socket access from within a service, which the
# sandbox needs to actually execute/verify generated code, so they keep
# running on the original machine, pointed at Neon/Redis's own external
# connection URLs. See docs/deployment.md for the full setup.
#
# DATABASE_URL is NOT provisioned by this blueprint on purpose: Render
# caps free accounts at ONE active free Postgres instance -- confirmed
# live, twice, via a real "cannot have more than one active free tier
# database" failure that canceled the whole deploy. Neon's free tier
# supports pgvector on every plan with no separate account-slot limit, so
# DATABASE_URL is a manually-set secret (like the API keys below), not a
# `databases:` block here.

services:
  - type: keyvalue
    name: practice-forge-redis
    plan: free
    ipAllowList: [] # tightened per docs/deployment.md once you know your worker machine's IP

  - type: web
    name: practice-forge-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # set to your real Neon connection string in the Render dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: practice-forge-redis
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        # Render has no blueprint property for "another service's own
        # public URL" (only its own via RENDER_EXTERNAL_URL, and `host`/
        # `hostport` are the INTERNAL network address, not the public
        # one) -- this is the real, predictable public URL Render gives
        # practice-forge-web by its documented onrender.com naming
        # convention. Update this if you ever rename that service or add
        # a custom domain to it.
        value: https://practice-forge-web.onrender.com
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard, never committed
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: practice-forge-web
    runtime: docker
    dockerfilePath: ./docker/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: API_PROXY_HOST
        # `hostport` (not `host` alone) -- this is the real internal
        # network address, "name:port", confirmed against Render's own
        # blueprint spec docs; `host` alone omits the port. next.config.ts
        # prepends "http://" itself -- see its own comment for why this
        # env var is host:port, not a full URL.
        fromService:
          type: web
          name: practice-forge-api
          property: hostport
      - key: NODE_ENV
        value: production
