# Which provider/model serves each pipeline stage, and the rate limits each
# (provider, model) pair must respect. Nothing in code hardcodes a model —
# change routing here, restart the pipeline, done.
#
# Pivoted to Gemini free tier (see docs/adr/0006) after the Anthropic account
# turned out to have no billing credit. Anthropic backend is kept working
# (below) for whenever a paid budget exists again — just repoint a stage's
# `provider`/`model` back to `anthropic`/`claude-*`.
#
# IMPORTANT — model availability is account-specific and changes over time.
# `gemini-2.5-flash` / `gemini-2.5-flash-lite` are already retired for new
# accounts as of this writing; `gemini-2.5-pro` has zero free-tier quota on
# this account (confirmed via a live 429 quoting `limit: 0`). The rolling
# `*-latest` aliases are what actually work today. Re-verify with a live call
# before trusting this file blindly — see docs/adr/0006.
#
# thinking_budget: leave UNSET for gemini-flash-lite-latest. It doesn't think
# by default (verified: 0 thoughts tokens with no thinking_config at all),
# and explicitly passing thinking_budget=0 to it is a 400 INVALID_ARGUMENT —
# confirmed live, not assumed. "Disabled" and "omitted" are not the same
# thing for this model/field; only omitted works.

stages:
  s1_metadata:
    provider: gemini
    # Fallback only — extract_metadata's free regex heuristic runs first;
    # this only fires when that comes back "Unknown Title" (confirmed
    # live: every one of this project's real full-book ingests). Schema-
    # bound extraction, same tier as s2/s3/s5/s6.
    model: gemini-flash-lite-latest
  s2_structure:
    provider: gemini
    model: gemini-flash-lite-latest
    # thinking_budget deliberately unset — see the note above this block.
  s3_confirm:
    provider: gemini
    model: gemini-flash-lite-latest
    # Pinned per explicit instruction to test whether the real run-to-run
    # confirm variance observed on the full book (84 vs 66 confirmed on an
    # identical candidate set) is sampling noise (temperature) or an
    # under-specified prompt. temperature=0 doesn't guarantee bit-for-bit
    # determinism on every provider/model, but it's the first, cheapest
    # thing to rule out before concluding the prompt itself is ambiguous.
    temperature: 0
  s4_vision:
    provider: gemini
    model: gemini-flash-lite-latest
    # Dead config, not a live path: S4 was descoped to pure regex, no LLM
    # call at all (docs/adr/0007) — nothing in src/ ever routes through
    # stage="s4_vision". Left here (not deleted) in case figure
    # interpretation is ever actually implemented; pointed at flash-lite
    # for consistency with every other schema-bound stage, not flash-latest.
  s5_distillation:
    provider: gemini
    model: gemini-flash-lite-latest
    # Moved off gemini-flash-latest 2026-08-10 (see docs/adr/0006's
    # addendum): distillation is schema-bound structured extraction, not
    # reasoning that benefits from a thinking budget, and flash-latest's
    # real 20/day cap (confirmed live via a 429, not assumed) was the
    # entire reason distillation needed to span multiple real days on the
    # recall-fixed ~305-problem pool. flash-lite's much higher cap removes
    # that bottleneck outright.
  s6_scoring:
    provider: gemini
    model: gemini-flash-lite-latest
  s8_variant_generation:
    provider: gemini
    # REVERTED to the standing policy 2026-08-11 (flash-latest's daily
    # quota reset; confirmed live via data/llm_rate_limit_state.json
    # showing zero gemini-flash-latest requests recorded for today before
    # this session's real re-verification batch). The 2026-08-10 same-day
    # workaround (gemini-flash-lite-latest) is over — this and s9_codegen
    # are real reasoning stages (a wrong-but-plausible variant or a
    # subtly-wrong generated solution is a real product failure), unlike
    # S2/S3/S5/S6's schema-bound extraction/classification, so they're
    # deliberately reserved on the strongest available free-tier model,
    # not just defaulted here. No working free-tier Pro model exists on
    # this account (re-verify live before ever trusting that finding
    # again — aliases have already moved once) — Flash with thinking left
    # on is the deepest reasoning available today.
    model: gemini-flash-latest
  s9_codegen:
    provider: gemini
    # REVERTED 2026-08-11 — see s8_variant_generation above. Real 20/day
    # cap confirmed live via a 429 (docs/adr/0006's addendum) — every real
    # consumer of this stage (pf generate, pf reverify, pf calibrate) now
    # draws from that same real, tight, shared daily bucket.
    model: gemini-flash-latest
  chat_explain_step:
    provider: gemini
    # P12 (explain-a-step): a real, synchronous per-request Q&A call, not a
    # pipeline stage -- deliberately on the high-RPD model so it never
    # competes with s8/s9/calibrate's tight 20/day gemini-flash-latest
    # budget (see that stage's own comments on today's manual reservation).
    model: gemini-flash-lite-latest
  s9_blind_resolve:
    provider: gemini
    # DELIBERATELY the OTHER real Gemini model from s9_codegen's standing
    # policy (gemini-flash-latest) — see blind_resolve.py's
    # BlindResolveModelCollisionError, which raises loudly at call time if
    # this ever ends up pointed at the same (provider, model) as
    # s9_codegen. 20/20 agreement between a solver and a re-solver on the
    # SAME model measures nothing; the whole point of this stage is a
    # genuinely independent second opinion, so errors don't correlate.
    # Now that s9_codegen is back on gemini-flash-latest (see above), this
    # stage's flash-lite-latest routing is genuinely different again —
    # the collision guard would fire if that ever changes.
    model: gemini-flash-lite-latest

# RPM figures are conservative published free-tier norms for each tier as of
# this writing — Google doesn't expose per-key limits via the API, only via
# the account-specific AI Studio rate-limit page, which isn't fetchable here.
# RPD figures for the *-latest aliases carry forward the approximate figures
# the user gave for the equivalent tier of the (now-retired) pinned 2.5 model
# names. Treat all of these as best-effort defaults — verify against
# https://aistudio.google.com/rate-limit for this account and correct here,
# not in code.
#
# gemini-flash-latest CORRECTED 2026-08-10, confirmed live, not estimated:
# a real 429 mid-run showed "gemini-flash-latest" now resolves to a
# DIFFERENT underlying model than assumed (`gemini-3.6-flash`, per the
# error body) with a real free-tier cap of 20 requests/day — our own
# limiter's stale 250 let 23 requests through today before Google's own
# enforcement rejected the 24th. This is exactly the risk the comment
# above already warned about (rolling aliases silently repoint to a
# different real model/quota) — it just actually happened. See
# docs/adr/0006's 2026-08-10 addendum for the full writeup and the
# resulting routing change (S5 moved off this model).
#
# gemini-flash-lite-latest's 1000/day is STILL only an estimate, not a
# confirmed number like the 20 above — it has never actually been
# exhausted live. The highest real single-day count survived without a
# 429 so far is 132 requests, which is consistent with 1000 but doesn't
# prove it. Don't read the two RPD numbers below as equally solid.
limits:
  gemini:
    gemini-flash-lite-latest: { rpm: 15, rpd: 1000 }
    gemini-flash-latest: { rpm: 10, rpd: 20 }
    # gemini-embedding-001 isn't a generate_content model, so it has no
    # "stage" entry above — embedding.py calls limits_for() directly with
    # this (provider, model) pair. No real number for this model has been
    # confirmed anywhere in this repo (checked docs/adr/0006 and 0008 —
    # both explicitly flag it as unaddressed, not just approximate like
    # the figures above). Deliberately conservative placeholder pending
    # verification against https://aistudio.google.com/rate-limit — the
    # 700-page projection needs only ~2 embedding calls total (100-item
    # batch cap), so this is far from binding either way.
    gemini-embedding-001: { rpm: 5, rpd: 100 }
  anthropic:
    claude-haiku-4-5: { rpm: 50, rpd: 100000 }
    claude-sonnet-5: { rpm: 50, rpd: 100000 }
    claude-opus-5: { rpm: 50, rpd: 100000 }
