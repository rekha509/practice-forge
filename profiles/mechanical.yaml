key: mechanical
display_name: Mechanical Engineering
sandbox_image_tag: practice-forge-sandbox-mechanical:latest

solver_libs: [pint, numpy, scipy, sympy, CoolProp, matplotlib]
ml_libs: [scikit-learn, pandas, filterpy, torch]

allowed_extension_types:
  - surrogate_model
  - digital_twin
  - anomaly_detection
  - design_optimisation
  - sensitivity_analysis
  - uncertainty_quantification
  - physics_informed

# aliases: real terms a book's own chapter/section titles use for this
# topic — bare topic names rarely overlap enough with a real chapter title
# to clear structure.py's TOPIC_MATCH_THRESHOLD via keyword overlap alone
# (S7's ">= 6 distinct topics" constraint was reporting 0 before aliases
# existed at all, since match_topic_nodes had nothing but 7 bare names to
# match against).
#
# 2026-08-10: the single "Thermodynamics" node (see git history) was
# replaced by 12 real subtopics, informed by the real 22-chapter TOC of
# Thermodynamics by P.K. Nag (this project's real reference book) — almost
# every one of that book's chapters IS a thermodynamics subtopic, so they
# ALL aliased onto one node and the >=6-distinct-topics constraint was
# structurally unreachable no matter how good the aliases got (verified:
# only 3 distinct topics matched across the whole book with the old single
# node). Chapters not covered by one of these 12 (Introduction,
# Temperature, Work and Heat Transfer, Statistical Thermodynamics,
# Irreversible Thermodynamics, Kinetic Theory of Gases, Transport
# Processes in Gases) are deliberately left unmatched rather than
# force-fit into a subtopic they don't really belong to.
topics:
  - name: Strength of Materials
    aliases:
      - Stress and Strain
      - Deflection of Beams
      - Torsion
      - Elasticity
      - Mechanics of Materials
  - name: First Law
    aliases:
      - First Law of Thermodynamics
      - First Law Applied to Flow Processes
      - Conservation of Energy
      - Internal Energy
  - name: Second Law
    aliases:
      - Second Law of Thermodynamics
      - Carnot Cycle
      - Heat Engines
      - Clausius Inequality
  - name: Entropy
    aliases:
      - Entropy Generation
      - Principle of Increase of Entropy
  - name: Available Energy and Exergy
    aliases:
      - Available Energy, Exergy and Irreversibility
      - Exergy
      - Irreversibility
      - Second Law Efficiency
  - name: Properties of Pure Substances
    aliases:
      - Properties of Gases and Gas Mixtures
      - Steam Tables
      - Phase Equilibrium
      - Quality of Steam
  - name: Thermodynamic Relations
    aliases:
      - Thermodynamic Relations, Equilibrium and Third Law
      - Maxwell Relations
      - Thermodynamic Equilibrium
      - Third Law of Thermodynamics
  - name: Vapour Power Cycles
    aliases:
      - Rankine Cycle
      - Steam Power Plant
  - name: Gas Power Cycles
    aliases:
      - Otto Cycle
      - Diesel Cycle
      - Brayton Cycle
      - Gas Turbine Cycles
  - name: Refrigeration
    aliases:
      - Refrigeration Cycles
      - Vapour Compression Refrigeration
      - Vapour Absorption Refrigeration
  - name: Psychrometrics
    aliases:
      - Psychrometry
      - Air Conditioning
      - Humidity
  - name: Reactive Mixtures
    aliases:
      - Reactive Systems
      - Combustion
      - Fuel-Air Mixtures
  - name: Compressible Flow
    aliases:
      - Compressible Fluid Flow
      - Mach Number
      - Nozzles and Diffusers
  - name: Fluid Mechanics
    aliases:
      - Fluid Flow
      - Bernoulli's Equation
      - Viscosity
      - Boundary Layer
      - Fluid Statics
  - name: Theory of Machines
    aliases:
      - Kinematics of Machinery
      - Dynamics of Machinery
      - Gears
      - Cams
      - Governors
      - Balancing
  - name: Machine Design
    aliases:
      - Design of Shafts
      - Design of Springs
      - Fatigue Design
      - Fasteners
      - Bearings
  - name: Heat & Mass Transfer
    aliases:
      - Conduction
      - Convection
      - Radiation
      - Heat Exchangers
      - Mass Transfer
      - Elements of Heat Transfer
      - Transport Processes
  - name: IC Engines
    aliases:
      - Internal Combustion Engines
      - Engine Cycles
      - Combustion Engines
      - Diesel Engine
      - Petrol Engine
